onboarding = false
# herdr configuration
# ~/.config/herdr/config.toml にシンボリックリンクされる
# .tmux.conf (dracula テーマ) に合わせて設定

[theme]
# .tmux.conf で使っている dracula テーマに合わせる
name = "terminal"

auto_switch = false
[terminal]
# .tmux.conf の `set-option -g default-shell /bin/zsh` に合わせる
default_shell = "/bin/zsh"

[keys]
# .tmux.conf の `set -g prefix C-b` に合わせる
prefix = "ctrl+b"
# .tmux.conf の `bind | split-window -h` (左右分割) に合わせる
split_vertical = "prefix+|"
# .tmux.conf の `bind - split-window -v` (上下分割) に合わせる
split_horizontal = "prefix+minus"

[ui]
# エージェントのタブ名と作業タイトルを見やすくする
sidebar_width = 42
sidebar_max_width = 48
# 新規タブ作成時の名前入力プロンプトを無効化 (auto-rename-tabs.sh が自動命名するため)
prompt_new_tab_name = false
# .tmux.conf の `set -g mouse on` に合わせてマウス操作を有効化
mouse_capture = true
# .tmux.conf のペイン分割スタイルに合わせて枠線・間隔を表示
pane_borders = true
pane_gaps = true
# ペイン枠線を明るく (dracula の Purple)
accent = "#bd93f9"

agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents]
# 1行目: 状態・エージェントのアイコン・タブ名
# 2行目: 作業タイトル。Local・ワークスペース名・claude/codex の文字は出さない
rows = [
  ["state_icon", { token = "$agent_icon", bold = true }, "tab"],
  [{ token = "$task_title", fg = "#cdd6f4" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "$agent_icon", fg = "#ffb86c", bold = true }, "tab"], [{ token = "$task_title", fg = "#cdd6f4" }]]
codex = [["state_icon", { token = "$agent_icon", fg = "#8be9fd", bold = true }, "tab"], [{ token = "$task_title", fg = "#cdd6f4" }]]

[ui.sidebar.spaces]
# 上の machines 欄も省略せず、名前を1行で表示する
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[theme.custom]
# ペイン枠線を明るく (dracula の Comment 色を使用)
overlay0 = "#6272a4"
overlay1 = "#6272a4"
# ターミナルの赤色を明るく (dracula 公式の Red よりさらに明るく調整)
red = "#ff7a7a"

[experimental]
pane_history = true

[ui.toast]
delivery = "system"
